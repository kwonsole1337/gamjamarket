{% extends "base.html" %}
{% block title %}로그인 - 감자마켓{% endblock %}
{% block search_bar %}{% endblock %}

{% block content %}
<div class="form-page">
  <div style="text-align:center; margin: 20px 0 28px;">
    <div style="font-size:52px;">🥔</div>
    <h1 style="font-size:19px; margin:8px 0 0;">감자마켓 로그인</h1>
    <p style="font-size:13px; color:var(--muted); margin-top:4px;">우리 동네 중고거래, 감자마켓에서</p>
  </div>

  <form method="post" action="{{ url_for('auth.login') }}">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">로그인</button>
  </form>

  <p style="text-align:center; font-size:13.5px; margin-top:18px; color:var(--muted);">
    아직 계정이 없으신가요?
    <a href="{{ url_for('auth.register') }}" style="color:var(--accent-dark); font-weight:700;">회원가입</a>
  </p>
</div>
{% endblock %}

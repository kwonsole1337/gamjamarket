{% extends "base.html" %}
{% block title %}회원가입 - 감자마켓{% endblock %}
{% block search_bar %}{% endblock %}

{% block content %}
<div class="form-page">
  <h1 style="font-size:19px; margin: 10px 0 20px;">회원가입</h1>

  <form method="post" action="{{ url_for('auth.register') }}">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" value="{{ form.get('username','') }}" required>
    </div>
    <div class="field">
      <label for="nickname">닉네임</label>
      <input type="text" id="nickname" name="nickname" value="{{ form.get('nickname','') }}" placeholder="채팅과 게시글에 표시돼요" required>
    </div>
    <div class="field">
      <label for="phone">전화번호 (선택)</label>
      <input type="tel" id="phone" name="phone" value="{{ form.get('phone','') }}" placeholder="010-0000-0000">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <p class="field-hint">8자 이상 입력해주세요.</p>
    </div>
    <div class="field">
      <label for="password_confirm">비밀번호 확인</label>
      <input type="password" id="password_confirm" name="password_confirm" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">가입하기</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}결제완료 - 감자마켓{% endblock %}
{% block search_bar %}{% endblock %}

{% block content %}
<div class="empty-state">
  <div style="font-size:52px;">✅</div>
  <p style="font-weight:700; font-size:16px; color:var(--brown-deep);">결제가 완료되었어요</p>
  <p>{{ purchase.product.title }}</p>
  <p style="font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--brown-deep);">{{ purchase.amount|won }}</p>
  <p style="margin-top:14px;">판매자가 거래를 확정하면 정산이 완료돼요.</p>
  <div style="margin-top:18px;">
    <a class="btn btn-outline" style="width:auto; padding:10px 18px;" href="{{ url_for('mypage.buying') }}">구매내역 보기</a>
  </div>
</div>
{% endblock %}
